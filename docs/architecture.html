<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Third API 运行时架构</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #eb6c36;   /* atomic-tangerine */
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Third API</p>
    <h1>Third API 运行时架构</h1>

    <svg viewBox="0 0 840 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="third-api-architecture-title third-api-architecture-desc">
      <title id="third-api-architecture-title">Third API 运行时架构</title>
      <desc id="third-api-architecture-desc">架构图展示业务系统通过声明式接口与动态代理统一调用第三方 HTTP 接口，管理端负责配置下发、健康监测与审计，配置以长轮询方式热更新。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ===== Zones (drawn before arrows and nodes) ===== -->
      <!-- Zone: 业务系统 -->
      <rect x="24" y="80" width="496" height="520" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="220" y="84" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="272" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">业务系统 · BUSINESS APP</text>

      <!-- Zone: 第三方服务 -->
      <rect x="556" y="208" width="240" height="392" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="624" y="212" width="104" height="12" rx="2" fill="#f5f5f5"/>
      <text x="676" y="221" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">第三方服务 · THIRD-PARTY</text>

      <!-- Zone: 管理端 -->
      <rect x="24" y="672" width="768" height="152" rx="8"
            fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="360" y="676" width="96" height="12" rx="2" fill="#f5f5f5"/>
      <text x="408" y="685" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.14em">管理端 · ADMIN SERVER</text>

      <!-- ===== Arrows first (behind boxes) ===== -->
      <!-- A1 → A2 方法调用 -->
      <line x1="154" y1="208" x2="154" y2="240" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A2 → A4 日志指标 -->
      <path d="M 244,272 H 264 Q 272,272 272,264 V 168 Q 272,160 280,160"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- A2 → C1 核心 HTTP 调用链路 -->
      <line x1="244" y1="304" x2="572" y2="304" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <!-- A3 → A2 配置热更新 -->
      <line x1="154" y1="496" x2="154" y2="336" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <!-- A3 → B2 长轮询拉取配置 -->
      <path d="M 244,528 H 532 Q 540,528 540,536 V 652 Q 540,660 548,660 H 308 Q 300,660 300,652 V 704"
            fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <!-- B1 → B2 → B3 → B4 管理端内部 -->
      <line x1="200" y1="752" x2="240" y2="752" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="416" y1="752" x2="456" y2="752" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <line x1="632" y1="752" x2="672" y2="752" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <!-- B3 → C1 健康探测 -->
      <path d="M 560,704 V 648 Q 560,640 568,640 H 656 Q 664,640 664,648 V 360"
            fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <!-- ===== Arrow labels ===== -->
      <rect x="480" y="284" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="500" y="292" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">HTTP 调用</text>

      <rect x="162" y="394" width="32" height="12" rx="2" fill="#f5f5f5"/>
      <text x="178" y="404" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">热更新</text>

      <rect x="548" y="596" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="584" y="604" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">长轮询拉取配置</text>

      <rect x="588" y="648" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="608" y="656" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace"
            text-anchor="middle" letter-spacing="0.06em">健康探测</text>

      <!-- ===== Node: A1 业务接口 (Input/User) ===== -->
      <rect x="64" y="112" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="112" width="180" height="96" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="72" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="86" y="129" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BIZ</text>
      <text x="154" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">业务代码 · 声明式接口</text>
      <text x="154" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">@ThirdPartyApi · @ApiMethod</text>

      <!-- ===== Node: A2 统一调用执行器 (Focal coral) ===== -->
      <rect x="64" y="240" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="240" width="180" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="72" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="88" y="257" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CORE</text>
      <text x="154" y="292" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">统一调用执行器</text>
      <text x="154" y="308" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">动态代理 · 鉴权 · 重试熔断</text>

      <!-- ===== Node: A4 调用日志与指标 (Optional/Async dashed) ===== -->
      <rect x="280" y="112" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="280" y="112" width="180" height="96" rx="6" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="288" y="120" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.16)" stroke-width="0.8"/>
      <text x="302" y="129" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOG</text>
      <text x="370" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">调用日志与指标</text>
      <text x="370" y="180" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">SLF4J · 内存指标</text>

      <!-- ===== Node: A3 配置存储与同步 (Store/State) ===== -->
      <rect x="64" y="496" width="180" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="64" y="496" width="180" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="72" y="504" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="86" y="513" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CFG</text>
      <text x="154" y="548" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">配置存储与同步</text>
      <text x="154" y="564" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">本地 YAML · Admin 长轮询</text>

      <!-- ===== Node: C1 第三方服务商 HTTP 接口 (External/Cloud) ===== -->
      <rect x="572" y="240" width="180" height="120" rx="6" fill="#f5f5f5"/>
      <rect x="572" y="240" width="180" height="120" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="580" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="594" y="257" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="662" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">第三方服务商 HTTP 接口</text>
      <text x="662" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">短信 · 支付 · 鉴权 · 推送</text>

      <!-- ===== Node: B1 管理页面 (Backend) ===== -->
      <rect x="56" y="704" width="144" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="56" y="704" width="144" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="64" y="712" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="78" y="721" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">UI</text>
      <text x="128" y="756" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">管理页面</text>
      <text x="128" y="772" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">静态前端原型</text>

      <!-- ===== Node: B2 REST 管理 API (Backend) ===== -->
      <rect x="240" y="704" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="704" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="712" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="264" y="721" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REST</text>
      <text x="328" y="756" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REST 管理 API</text>
      <text x="328" y="772" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">应用 · 服务商 · 渠道 · 接口</text>

      <!-- ===== Node: B3 配置服务层 (Backend) ===== -->
      <rect x="456" y="704" width="176" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="704" width="176" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="464" y="712" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="478" y="721" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SRV</text>
      <text x="544" y="756" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">配置服务层</text>
      <text x="544" y="772" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">发布 · 快照 · 健康 · 审计</text>

      <!-- ===== Node: B4 SQLite / MySQL (Store/State) ===== -->
      <rect x="672" y="704" width="112" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="704" width="112" height="96" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="680" y="712" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.40)" stroke-width="0.8"/>
      <text x="694" y="721" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="728" y="756" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">SQLite / MySQL</text>
      <text x="728" y="772" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">本地 · 生产</text>

      <!-- ===== Legend (horizontal strip at the bottom) ===== -->
      <line x1="32" y1="844" x2="808" y2="844" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">图例</text>

      <line x1="124" y1="856" x2="148" y2="856" stroke="#4f5d75" stroke-width="1.2"/>
      <text x="156" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">内部调用 / 数据流</text>

      <line x1="316" y1="856" x2="340" y2="856" stroke="#eb6c36" stroke-width="1.4"/>
      <text x="348" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">核心调用链路（焦点）</text>

      <line x1="500" y1="856" x2="524" y2="856" stroke="#2e5aa8" stroke-width="1.2"/>
      <text x="532" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">HTTP 配置下发</text>

      <line x1="688" y1="856" x2="712" y2="856" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="720" y="860" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace">异步 / 被动流程</text>
    </svg>
  </div>
</body>
</html>
